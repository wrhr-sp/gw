name: hotel-platform-ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: werehere_hotel_ci
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d werehere_hotel_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/werehere_hotel_ci
      ALLOW_DESTRUCTIVE_TEST_DATABASE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 10.24.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for visual regression
        run: pnpm --filter @werehere/web exec playwright install --with-deps chromium

      - name: Lint boundaries and source
        run: pnpm run lint

      - name: Typecheck and unit tests
        run: pnpm run check

      - name: Build Web and API Worker
        run: |
          pnpm run build
          API_HYPERDRIVE_ID=00000000000000000000000000000000 \
            ZITADEL_ISSUER=https://preview.invalid \
            ZITADEL_CLIENT_ID=preview-client \
            ZITADEL_CONSOLE_CLIENT_ID=preview-console-client \
            ZITADEL_ORGANIZATION_ID=preview-organization \
            ZITADEL_REDIRECT_URI=https://preview.invalid/api/auth/callback \
            WEB_PREVIEW_URL=https://preview.invalid \
            GOOGLE_CALENDAR_OAUTH_CLIENT_ID=preview-calendar-client \
            GOOGLE_CALENDAR_OAUTH_REDIRECT_URI=https://preview.invalid/api/admin/calendar-connections/oauth/callback \
            CALENDAR_CREDENTIAL_AES_CURRENT_KEY_VERSION=1 \
            CALENDAR_FINGERPRINT_HMAC_CURRENT_KEY_VERSION=1 \
            node scripts/render-api-preview-config.mjs \
              apps/api/wrangler.preview.jsonc \
              apps/api/wrangler.preview.generated.json
          pnpm --filter @werehere/api exec wrangler deploy \
            --dry-run --config wrangler.preview.generated.json
          rm -f apps/api/wrangler.preview.generated.json
          RECONCILER_HYPERDRIVE_ID=00000000000000000000000000000000 \
            ZITADEL_ISSUER=https://preview.invalid \
            ZITADEL_ORGANIZATION_ID=preview-organization \
            GOOGLE_CALENDAR_OAUTH_CLIENT_ID=preview-calendar-client \
            CALENDAR_CREDENTIAL_AES_CURRENT_KEY_VERSION=1 \
            CALENDAR_FINGERPRINT_HMAC_CURRENT_KEY_VERSION=1 \
            node scripts/render-reconciler-preview-config.mjs \
              apps/api/wrangler.reconciler.preview.jsonc \
              apps/api/wrangler.reconciler.preview.generated.json
          pnpm --filter @werehere/api exec wrangler deploy --dry-run --config wrangler.reconciler.preview.generated.json
          rm -f apps/api/wrangler.reconciler.preview.generated.json
          pnpm --filter @werehere/web build:cloudflare
          pnpm --filter @werehere/web exec wrangler deploy --dry-run --config wrangler.jsonc

      - name: Build file processor container
        run: docker build -f apps/file-processor/Dockerfile -t werehere-file-processor:ci .

      - name: Visual regression
        run: pnpm run test:visual

      - name: Upload visual regression artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: visual-regression-${{ github.run_id }}
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: PostgreSQL migration and boundary tests
        run: pnpm run test:integration

      - name: Worker authentication and hotel runtime smoke
        run: pnpm --filter @werehere/api test:worker
