name: preview-revoke-bootstrap-sessions

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-revoke-bootstrap-sessions
  cancel-in-progress: false

jobs:
  revoke-sessions:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: preview
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.24.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.22.1
          cache: pnpm

      - name: Install dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Revoke approved bootstrap sessions
        env:
          DATABASE_URL_PREVIEW: ${{ secrets.DATABASE_URL_PREVIEW }}
          PREVIEW_BOOTSTRAP_APPROVAL_REF: ${{ vars.PREVIEW_BOOTSTRAP_APPROVAL_REF }}
          PREVIEW_DATABASE_IDENTITY_SHA256: ${{ secrets.PREVIEW_DATABASE_IDENTITY_SHA256 }}
          ZITADEL_ISSUER: ${{ vars.ZITADEL_ISSUER }}
          ZITADEL_ORGANIZATION_ID: ${{ vars.ZITADEL_ORGANIZATION_ID }}
          ZITADEL_PREVIEW_SUBJECT: ${{ secrets.ZITADEL_PREVIEW_SUBJECT }}
          ZITADEL_PREVIEW_SUBJECT_SHA256: ${{ secrets.ZITADEL_PREVIEW_SUBJECT_SHA256 }}
          ZITADEL_PREVIEW_ISSUER_SHA256: ${{ secrets.ZITADEL_PREVIEW_ISSUER_SHA256 }}
          ZITADEL_PREVIEW_ORGANIZATION_ID_SHA256: ${{ secrets.ZITADEL_PREVIEW_ORGANIZATION_ID_SHA256 }}
          ZITADEL_USER_PROVISIONER_TOKEN: ${{ secrets.ZITADEL_USER_PROVISIONER_TOKEN }}
        run: pnpm exec tsx packages/db/scripts/revoke-preview-bootstrap-sessions.ts
