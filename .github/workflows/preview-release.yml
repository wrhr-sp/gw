name: hotel-preview-release

on:
  workflow_dispatch:
    inputs:
      preview_hyperdrive_retarget:
        description: Allow one-time retarget only when the existing API Hyperdrive does not match the canonical Preview database
        required: true
        default: false
        type: boolean
      preview_unresponsive_worker_redeploy:
        description: Allow one-time redeploy only when existing Preview Workers time out and canonical dependencies remain verified
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  deployments: write

concurrency:
  group: preview-file-scanner
  cancel-in-progress: false

jobs:
  deploy-preview:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: preview
      url: https://werehere-hotel-web-preview.wereheresp.workers.dev
    env:
      ZITADEL_ISSUER: ${{ vars.ZITADEL_ISSUER }}
      ZITADEL_CLIENT_ID: ${{ vars.ZITADEL_CLIENT_ID }}
      ZITADEL_CONSOLE_CLIENT_ID: ${{ vars.ZITADEL_CONSOLE_CLIENT_ID }}
      ZITADEL_REDIRECT_URI: ${{ vars.ZITADEL_REDIRECT_URI }}
      ZITADEL_ORGANIZATION_ID: ${{ vars.ZITADEL_ORGANIZATION_ID }}
      PREVIEW_BOOTSTRAP_APPROVAL_REF: ${{ vars.PREVIEW_BOOTSTRAP_APPROVAL_REF }}
      PREVIEW_R2_BUCKET_NAME: werehere-hotel-files-preview
      WEB_PREVIEW_URL: https://werehere-hotel-web-preview.wereheresp.workers.dev
      API_RUNTIME_DATABASE_URL_FILE: /tmp/werehere-preview-api-runtime-url
      RECONCILER_DATABASE_URL_FILE: /tmp/werehere-preview-reconciler-url

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 10.24.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for Console smoke
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify scheduled account and hotel entrypoint contract
        run: |
          pnpm exec vitest run \
            apps/api/test/inspection-materializer.spec.ts

      - name: Validate required Preview configuration
        env:
          AUTH_TRANSACTION_ENCRYPTION_KEY: ${{ secrets.AUTH_TRANSACTION_ENCRYPTION_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_PREVIEW: ${{ secrets.DATABASE_URL_PREVIEW }}
          DATABASE_API_RUNTIME_PASSWORD_PREVIEW: ${{ secrets.DATABASE_API_RUNTIME_PASSWORD_PREVIEW }}
          DATABASE_RECONCILER_PASSWORD_PREVIEW: ${{ secrets.DATABASE_RECONCILER_PASSWORD_PREVIEW }}
          ZITADEL_SERVICE_USER_TOKEN: ${{ secrets.ZITADEL_SERVICE_USER_TOKEN }}
          ZITADEL_USER_PROVISIONER_TOKEN: ${{ secrets.ZITADEL_USER_PROVISIONER_TOKEN }}
          ZITADEL_PREVIEW_SUBJECT: ${{ secrets.ZITADEL_PREVIEW_SUBJECT }}
          ZITADEL_PREVIEW_SUBJECT_SHA256: ${{ secrets.ZITADEL_PREVIEW_SUBJECT_SHA256 }}
          PREVIEW_BOOTSTRAP_LOGIN_ID: ${{ secrets.PREVIEW_BOOTSTRAP_LOGIN_ID }}
          ZITADEL_PREVIEW_PASSWORD: ${{ secrets.ZITADEL_PREVIEW_PASSWORD }}
          PREVIEW_FILE_SCANNER_AGENT_TOKEN: ${{ secrets.PREVIEW_FILE_SCANNER_AGENT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          required=(
            AUTH_TRANSACTION_ENCRYPTION_KEY
            DATABASE_URL
            DATABASE_URL_PREVIEW
            DATABASE_API_RUNTIME_PASSWORD_PREVIEW
            DATABASE_RECONCILER_PASSWORD_PREVIEW
            ZITADEL_SERVICE_USER_TOKEN
            ZITADEL_USER_PROVISIONER_TOKEN
            ZITADEL_PREVIEW_SUBJECT
            ZITADEL_PREVIEW_SUBJECT_SHA256
            PREVIEW_BOOTSTRAP_LOGIN_ID
            ZITADEL_PREVIEW_PASSWORD
            PREVIEW_FILE_SCANNER_AGENT_TOKEN
            ZITADEL_ISSUER
            ZITADEL_CLIENT_ID
            ZITADEL_CONSOLE_CLIENT_ID
            ZITADEL_REDIRECT_URI
            ZITADEL_ORGANIZATION_ID
            PREVIEW_BOOTSTRAP_APPROVAL_REF
          )
          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            for name in "${missing[@]}"; do
              printf 'Missing required Preview configuration: %s\n' "$name" >&2
            done
            exit 1
          fi
          if [[ "${#PREVIEW_FILE_SCANNER_AGENT_TOKEN}" -lt 32 || \
                "${#PREVIEW_FILE_SCANNER_AGENT_TOKEN}" -gt 256 ]]; then
            printf '%s\n' 'Preview scanner agent secret was invalid.' >&2
            exit 1
          fi
          unset DATABASE_URL
          unset DATABASE_URL_PREVIEW
          unset DATABASE_API_RUNTIME_PASSWORD_PREVIEW
          unset DATABASE_RECONCILER_PASSWORD_PREVIEW
          unset ZITADEL_SERVICE_USER_TOKEN
          unset ZITADEL_USER_PROVISIONER_TOKEN
          unset ZITADEL_PREVIEW_SUBJECT
          unset ZITADEL_PREVIEW_SUBJECT_SHA256
          unset PREVIEW_BOOTSTRAP_LOGIN_ID
          unset ZITADEL_PREVIEW_PASSWORD
          unset PREVIEW_FILE_SCANNER_AGENT_TOKEN
          node <<'NODE'
          const key = process.env.AUTH_TRANSACTION_ENCRYPTION_KEY;
          const bytes = Buffer.from(key, "base64url");
          if (!/^[A-Za-z0-9_-]+$/u.test(key)
            || bytes.byteLength !== 32
            || bytes.toString("base64url") !== key) {
            throw new Error("AUTH_TRANSACTION_ENCRYPTION_KEY must be canonical 256-bit base64url");
          }
          const { hkdfSync } = require("node:crypto");
          const identifierKey = hkdfSync(
            "sha256",
            bytes,
            Buffer.from("werehere-auth-rate-limit-salt-v1"),
            Buffer.from("werehere-auth-rate-limit-hmac-v1"),
            32,
          );
          if (identifierKey.byteLength !== 32) {
            throw new Error("AUTH identifier HMAC subkey derivation failed");
          }
          const expectedRedirect = "https://werehere-hotel-web-preview.wereheresp.workers.dev/api/auth/callback";
          if (process.env.ZITADEL_REDIRECT_URI !== expectedRedirect) {
            throw new Error("ZITADEL_REDIRECT_URI does not match the Preview Web callback");
          }
          NODE
          unset AUTH_TRANSACTION_ENCRYPTION_KEY
          API_HYPERDRIVE_ID=00000000000000000000000000000000 \
            node scripts/render-api-preview-config.mjs \
              apps/api/wrangler.preview.jsonc \
              /tmp/werehere-api-preview-preflight.json
          rm -f /tmp/werehere-api-preview-preflight.json
          printf '%s\n' 'PREVIEW_CONFIGURATION_PRESENT'

      - name: Verify approved ZITADEL bootstrap identity
        env:
          ZITADEL_ISSUER: ${{ vars.ZITADEL_ISSUER }}
          ZITADEL_ORGANIZATION_ID: ${{ vars.ZITADEL_ORGANIZATION_ID }}
          ZITADEL_PREVIEW_SUBJECT: ${{ secrets.ZITADEL_PREVIEW_SUBJECT }}
          ZITADEL_PREVIEW_SUBJECT_SHA256: ${{ secrets.ZITADEL_PREVIEW_SUBJECT_SHA256 }}
          ZITADEL_USER_PROVISIONER_TOKEN: ${{ secrets.ZITADEL_USER_PROVISIONER_TOKEN }}
        run: pnpm exec tsx packages/db/scripts/verify-zitadel-bootstrap.ts

      - name: Snapshot active Worker versions
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        id: worker_snapshot
        shell: bash
        run: |
          set -euo pipefail
          cloudflare_token="$CLOUDFLARE_API_TOKEN"
          worker_exists() {
            local worker_name="$1"
            local response_file
            response_file="$(mktemp)"
            local status
            if ! status="$(curl --silent --show-error \
              --output "$response_file" \
              --write-out '%{http_code}' \
              -H "Authorization: Bearer $cloudflare_token" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$worker_name/settings")"; then
              rm -f "$response_file"
              return 2
            fi
            if [[ "$status" == "200" ]]; then
              if jq -e '.success == true and (.result | type) == "object"' \
                "$response_file" >/dev/null; then
                rm -f "$response_file"
                return 0
              fi
              rm -f "$response_file"
              return 2
            fi
            if [[ "$status" == "404" ]]; then
              if jq -e '.success == false and (.errors | type) == "array"' \
                "$response_file" >/dev/null; then
                rm -f "$response_file"
                return 1
              fi
              rm -f "$response_file"
              return 2
            fi
            rm -f "$response_file"
            return 2
          }
          worker_hyperdrive_id() {
            local worker_name="$1"
            local binding_name="$2"
            local binding_alias="${3:-}"
            local binding_names=("$binding_name")
            if [[ -n "$binding_alias" ]]; then
              binding_names+=("$binding_alias")
            fi
            local response_file status id
            response_file="$(mktemp)"
            if ! status="$(curl --silent --show-error \
              --output "$response_file" \
              --write-out '%{http_code}' \
              -H "Authorization: Bearer $cloudflare_token" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$worker_name/settings")"; then
              rm -f "$response_file"
              return 1
            fi
            if [[ "$status" != "200" ]]; then
              rm -f "$response_file"
              return 1
            fi
            if ! id="$(
              node "$GITHUB_WORKSPACE/scripts/validate-cloudflare-worker-hyperdrive-binding.mjs" \
                "$response_file" "${binding_names[@]}"
            )"; then
              rm -f "$response_file"
              return 1
            fi
            rm -f "$response_file"
            printf '%s\n' "$id"
          }
          snapshot() {
            local output_name="$1"
            local worker_name="$2"
            if worker_exists "$worker_name"; then
              :
            else
              local exists_status="$?"
              if [[ "$exists_status" -eq 1 ]]; then
                printf '%s_previous=\n' "$output_name" >> "$GITHUB_OUTPUT"
                printf '%s_existed=false\n' "$output_name" >> "$GITHUB_OUTPUT"
                printf '%s_hyperdrive_id=\n' "$output_name" >> "$GITHUB_OUTPUT"
                return
              fi
              printf 'Worker existence lookup failed: %s\n' "$worker_name" >&2
              exit 1
            fi
            local hyperdrive_id=""
            if [[ "$output_name" == "api" ]]; then
              hyperdrive_id="$(worker_hyperdrive_id "$worker_name" API_HYPERDRIVE HYPERDRIVE)" || {
                printf 'API Worker Hyperdrive binding lookup failed.\n' >&2
                exit 1
              }
            elif [[ "$output_name" == "reconciler" ]]; then
              hyperdrive_id="$(worker_hyperdrive_id "$worker_name" RECONCILER_HYPERDRIVE)" || {
                printf 'Reconciler Worker Hyperdrive binding lookup failed.\n' >&2
                exit 1
              }
            fi
            local snapshot_file
            local version
            snapshot_file="$(mktemp)"
            pnpm --filter @werehere/api exec wrangler deployments list \
              --name "$worker_name" --json > "$snapshot_file"
            if ! version="$(jq -er '
              if type != "array" or length == 0 then
                error("Worker deployment history was missing")
              elif (.[-1].versions | type) != "array"
                or (.[-1].versions | length) != 1
                or (.[-1].versions[0].percentage | type) != "number"
                or .[-1].versions[0].percentage != 100
                or (.[-1].versions[0].version_id | type) != "string"
                or (.[-1].versions[0].version_id | length) == 0 then
                error("Active Worker deployment was not a single 100 percent version")
              else
                .[-1].versions[0].version_id
              end
            ' "$snapshot_file")"; then
              rm -f "$snapshot_file"
              printf 'Active Worker deployment is unsafe to snapshot: %s\n' "$worker_name" >&2
              exit 1
            fi
            rm -f "$snapshot_file"
            printf '%s_previous=%s\n' "$output_name" "$version" >> "$GITHUB_OUTPUT"
            printf '%s_existed=true\n' "$output_name" >> "$GITHUB_OUTPUT"
            printf '%s_hyperdrive_id=%s\n' "$output_name" "$hyperdrive_id" >> "$GITHUB_OUTPUT"
          }
          snapshot api werehere-hotel-api-preview
          snapshot reconciler werehere-hotel-account-reconciler-preview
          snapshot web werehere-hotel-web-preview

      - name: Validate Preview Worker snapshot topology
        shell: bash
        run: |
          set -euo pipefail
          api="${{ steps.worker_snapshot.outputs.api_existed }}"
          reconciler="${{ steps.worker_snapshot.outputs.reconciler_existed }}"
          web="${{ steps.worker_snapshot.outputs.web_existed }}"
          if [[ "$api" == "true" && "$reconciler" == "true" && "$web" == "true" ]]; then
            exit 0
          fi
          if [[ "$api" == "true" && "$reconciler" == "false" && "$web" == "true" ]]; then
            printf '%s\n' 'Preview reconciler bootstrap topology accepted.'
            exit 0
          fi
          if [[ "$api" == "false" && "$reconciler" == "false" && "$web" == "false" ]]; then
            exit 0
          fi
          printf '%s\n' 'Preview Worker topology is partial; refusing release.' >&2
          exit 1

      - name: Validate unresponsive Preview Worker recovery request
        shell: bash
        env:
          PREVIEW_UNRESPONSIVE_WORKER_REDEPLOY_APPROVED: ${{ inputs.preview_unresponsive_worker_redeploy }}
          PREVIEW_API_EXISTED: ${{ steps.worker_snapshot.outputs.api_existed }}
          PREVIEW_RECONCILER_EXISTED: ${{ steps.worker_snapshot.outputs.reconciler_existed }}
          PREVIEW_WEB_EXISTED: ${{ steps.worker_snapshot.outputs.web_existed }}
        run: |
          set -euo pipefail
          if [[ "$PREVIEW_UNRESPONSIVE_WORKER_REDEPLOY_APPROVED" != "true" ]]; then
            exit 0
          fi
          if [[ "$PREVIEW_API_EXISTED" != "true" || \
                "$PREVIEW_RECONCILER_EXISTED" != "true" || \
                "$PREVIEW_WEB_EXISTED" != "true" ]]; then
            printf '%s\n' 'PREVIEW_UNRESPONSIVE_WORKER_RECOVERY_COMPLETE_TOPOLOGY_REQUIRED' >&2
            exit 1
          fi
          printf '%s\n' 'PREVIEW_UNRESPONSIVE_WORKER_RECOVERY_REQUEST_TOPOLOGY_VERIFIED'

      - name: Expand Neon Preview database for compatible Worker deploy
        id: database_expand
        env:
          PREVIEW_PROVISION_PHASE: EXPAND
          PREVIEW_PROVISION_FRESH_BOOTSTRAP_FULL: "1"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_PREVIEW: ${{ secrets.DATABASE_URL_PREVIEW }}
          DATABASE_API_RUNTIME_PASSWORD_PREVIEW: ${{ secrets.DATABASE_API_RUNTIME_PASSWORD_PREVIEW }}
          DATABASE_RECONCILER_PASSWORD_PREVIEW: ${{ secrets.DATABASE_RECONCILER_PASSWORD_PREVIEW }}
          ZITADEL_PREVIEW_SUBJECT: ${{ secrets.ZITADEL_PREVIEW_SUBJECT }}
          ZITADEL_PREVIEW_SUBJECT_SHA256: ${{ secrets.ZITADEL_PREVIEW_SUBJECT_SHA256 }}
          PREVIEW_BOOTSTRAP_LOGIN_ID: ${{ secrets.PREVIEW_BOOTSTRAP_LOGIN_ID }}
          ZITADEL_PREVIEW_ORGANIZATION_ID: ${{ vars.ZITADEL_ORGANIZATION_ID }}
          PREVIEW_BOOTSTRAP_APPROVAL_REF: ${{ vars.PREVIEW_BOOTSTRAP_APPROVAL_REF }}
        run: |
          set -euo pipefail
          provision_log="$(mktemp)"
          trap 'rm -f "$provision_log"' EXIT
          pnpm exec tsx packages/db/scripts/provision-preview.ts | tee "$provision_log"
          if grep -Fxq 'PREVIEW_DATABASE_CONTRACT_COMPATIBLE_EXPAND' "$provision_log"; then
            printf 'contract_compatible=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'contract_compatible=false\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Verify previous Workers remain compatible after expand
        if: steps.worker_snapshot.outputs.api_existed == 'true' && steps.worker_snapshot.outputs.web_existed == 'true'
        id: pre_hyperdrive_compatibility
        env:
          PREVIEW_CONTRACT_COMPATIBLE_EXPAND: ${{ steps.database_expand.outputs.contract_compatible }}
          PREVIEW_HYPERDRIVE_RETARGET_APPROVED: ${{ inputs.preview_hyperdrive_retarget }}
          PREVIEW_UNRESPONSIVE_WORKER_REDEPLOY_APPROVED: ${{ inputs.preview_unresponsive_worker_redeploy }}
          PREVIEW_RECONCILER_EXISTED: ${{ steps.worker_snapshot.outputs.reconciler_existed }}
          PREVIEW_BOOTSTRAP_MAPPING_PHASE: PRE_ROTATION
        run: |
          set +e
          readiness_classification="$(
            node scripts/preview-hyperdrive-retarget-contract.mjs probe "$WEB_PREVIEW_URL"
          )"
          readiness_status="$?"
          set -e
          if [[ "$readiness_status" -eq 0 && "$readiness_classification" == "READY" ]]; then
            if [[ "$PREVIEW_UNRESPONSIVE_WORKER_REDEPLOY_APPROVED" == "true" ]]; then
              printf '%s\n' 'PREVIEW_UNRESPONSIVE_WORKER_REDEPLOY_APPROVED_WITHOUT_TIMEOUT' >&2
              exit 1
            fi
            node scripts/smoke-cloudflare-preview.mjs
            ZITADEL_PREVIEW_SUBJECT=${{ secrets.ZITADEL_PREVIEW_SUBJECT }} PREVIEW_BOOTSTRAP_LOGIN_ID=${{ secrets.PREVIEW_BOOTSTRAP_LOGIN_ID }} node scripts/smoke-zitadel-console-preview.mjs
            printf 'retarget_required=false\n' >> "$GITHUB_OUTPUT"
            printf 'legacy_schema_recovery_required=false\n' >> "$GITHUB_OUTPUT"
            printf 'unresponsive_redeploy_required=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$readiness_status" -eq 12 && "$readiness_classification" == "UNRESPONSIVE" ]]; then
            if [[ "$PREVIEW_UNRESPONSIVE_WORKER_REDEPLOY_APPROVED" != "true" ]]; then
              printf '%s\n' 'PREVIEW_EXISTING_UNRESPONSIVE_WORKER_REDEPLOY_NOT_APPROVED' >&2
              exit 1
            fi
            if [[ "$PREVIEW_HYPERDRIVE_RETARGET_APPROVED" != "false" ]]; then
              printf '%s\n' 'PREVIEW_UNRESPONSIVE_WORKER_REDEPLOY_RETARGET_CONFLICT' >&2
              exit 1
            fi
            if [[ "$PREVIEW_CONTRACT_COMPATIBLE_EXPAND" != "true" ]]; then
              printf '%s\n' 'PREVIEW_UNRESPONSIVE_WORKER_REDEPLOY_EXPAND_NOT_ATTESTED' >&2
              exit 1
            fi
            if [[ "$PREVIEW_RECONCILER_EXISTED" != "true" ]]; then
              printf '%s\n' 'PREVIEW_UNRESPONSIVE_WORKER_REDEPLOY_COMPLETE_TOPOLOGY_REQUIRED' >&2
              exit 1
            fi
            set +e
            web_classification="$(
              node scripts/preview-hyperdrive-retarget-contract.mjs probe-web "$WEB_PREVIEW_URL"
            )"
            web_status="$?"
            set -e
            if [[ "$web_status" -ne 0 || "$web_classification" != "WEB_READY" ]]; then
              printf '%s\n' 'PREVIEW_UNRESPONSIVE_WORKER_REDEPLOY_WEB_UNAVAILABLE' >&2
              exit 1
            fi
            printf 'retarget_required=false\n' >> "$GITHUB_OUTPUT"
            printf 'legacy_schema_recovery_required=false\n' >> "$GITHUB_OUTPUT"
            printf 'unresponsive_redeploy_required=true\n' >> "$GITHUB_OUTPUT"
            printf '%s\n' 'PREVIEW_EXISTING_UNRESPONSIVE_WORKER_REDEPLOY_REQUIRED'
            exit 0
          fi
          if [[ "$PREVIEW_UNRESPONSIVE_WORKER_REDEPLOY_APPROVED" == "true" ]]; then
            printf '%s\n' 'PREVIEW_UNRESPONSIVE_WORKER_REDEPLOY_APPROVED_WITHOUT_TIMEOUT' >&2
            exit 1
          fi
          if [[ "$readiness_status" -eq 11 && "$readiness_classification" == "SCHEMA_NOT_READY" ]]; then
            if [[ "$PREVIEW_HYPERDRIVE_RETARGET_APPROVED" != "true" && \
                  "$PREVIEW_CONTRACT_COMPATIBLE_EXPAND" != "true" ]]; then
              printf '%s\n' 'PREVIEW_EXISTING_LEGACY_SCHEMA_RECOVERY_NOT_APPROVED' >&2
              exit 1
            fi
            printf 'retarget_required=false\n' >> "$GITHUB_OUTPUT"
            printf 'legacy_schema_recovery_required=true\n' >> "$GITHUB_OUTPUT"
            printf 'unresponsive_redeploy_required=false\n' >> "$GITHUB_OUTPUT"
            printf 'legacy_schema_recovery_attested=%s\n' \
              "$PREVIEW_CONTRACT_COMPATIBLE_EXPAND" >> "$GITHUB_OUTPUT"
            printf '%s\n' 'PREVIEW_EXISTING_LEGACY_SCHEMA_RECOVERY_REQUIRED'
            exit 0
          fi
          if [[ "$readiness_status" -ne 10 || "$readiness_classification" != "DB_DEPENDENCY_UNAVAILABLE" ]]; then
            printf '%s\n' 'PREVIEW_EXISTING_WORKER_READINESS_UNCLASSIFIED' >&2
            exit 1
          fi
          if [[ "$PREVIEW_HYPERDRIVE_RETARGET_APPROVED" != "true" ]]; then
            printf '%s\n' 'PREVIEW_EXISTING_WORKER_DB_DEPENDENCY_UNAVAILABLE' >&2
            exit 1
          fi
          printf 'retarget_required=true\n' >> "$GITHUB_OUTPUT"
          printf 'legacy_schema_recovery_required=false\n' >> "$GITHUB_OUTPUT"
          printf 'unresponsive_redeploy_required=false\n' >> "$GITHUB_OUTPUT"
          printf '%s\n' 'PREVIEW_EXISTING_WORKER_RETARGET_REQUIRED'

      - name: Create or update Preview Hyperdrives
        id: hyperdrive
        shell: bash
        working-directory: apps/api
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PREVIEW_HYPERDRIVE_RETARGET_APPROVED: ${{ inputs.preview_hyperdrive_retarget }}
          PREVIEW_HYPERDRIVE_RETARGET_REQUIRED: ${{ steps.pre_hyperdrive_compatibility.outputs.retarget_required }}
          PREVIEW_LEGACY_SCHEMA_RECOVERY_ATTESTED: ${{ steps.pre_hyperdrive_compatibility.outputs.legacy_schema_recovery_attested }}
          PREVIEW_LEGACY_SCHEMA_RECOVERY_REQUIRED: ${{ steps.pre_hyperdrive_compatibility.outputs.legacy_schema_recovery_required }}
          PREVIEW_UNRESPONSIVE_REDEPLOY_REQUIRED: ${{ steps.pre_hyperdrive_compatibility.outputs.unresponsive_redeploy_required }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/hyperdrive/configs"
          list_url="$api?per_page=100"
          temp_dir="$(mktemp -d)"
          legacy_before="$temp_dir/legacy-before.json"
          legacy_after="$temp_dir/legacy-after.json"
          trap 'rm -rf "$temp_dir"' EXIT
          fetch_hyperdrive_list() {
            local output_file="$1"
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "$list_url" > "$output_file"
            if ! node "$GITHUB_WORKSPACE/scripts/validate-cloudflare-hyperdrive-list.mjs" "$output_file" >/dev/null; then
              printf '%s\n' 'Hyperdrive list response failed safety validation.' >&2
              return 1
            fi
          }
          snapshot_legacy_hyperdrive() {
            local output_file="$1"
            local list_file
            local count
            list_file="$(mktemp "$temp_dir/hyperdrive-list.XXXXXX")"
            fetch_hyperdrive_list "$list_file"
            count="$(jq '[.result[] | select(.name == "werehere-hotel-preview")] | length' "$list_file")"
            if [[ "$count" -ne 1 ]]; then
              printf '%s\n' 'The legacy Preview Hyperdrive is unavailable or ambiguous.' >&2
              return 1
            fi
            jq -S '.result[] | select(.name == "werehere-hotel-preview")' \
              "$list_file" > "$output_file"
          }
          hyperdrive_count() {
            local list_file="$1"
            local name="$2"
            local expected_id="$3"
            if [[ -n "$expected_id" ]]; then
              jq --arg id "$expected_id" '[.result[] | select(.id == $id)] | length' "$list_file"
            else
              jq --arg name "$name" '[.result[] | select(.name == $name)] | length' "$list_file"
            fi
          }
          write_hyperdrive_config() {
            local list_file="$1"
            local output_file="$2"
            local name="$3"
            local expected_id="$4"
            if [[ -n "$expected_id" ]]; then
              jq -eS --arg id "$expected_id" '
                .result[] | select(.id == $id) | {id, name, origin, caching}
              ' "$list_file" > "$output_file"
            else
              jq -eS --arg name "$name" '
                .result[] | select(.name == $name) | {id, name, origin, caching}
              ' "$list_file" > "$output_file"
            fi
          }
          hyperdrive_target_state() {
            local name="$1"
            local url_file="$2"
            local expected_id="$3"
            local list_file
            local config_file
            local count
            list_file="$(mktemp "$temp_dir/hyperdrive-target-list.XXXXXX")"
            config_file="$(mktemp "$temp_dir/hyperdrive-target-config.XXXXXX")"
            fetch_hyperdrive_list "$list_file"
            count="$(hyperdrive_count "$list_file" "$name" "$expected_id")"
            if [[ "$count" -ne 1 ]]; then
              printf '%s\n' 'The existing API Hyperdrive binding is unavailable or ambiguous for retarget validation.' >&2
              return 2
            fi
            write_hyperdrive_config "$list_file" "$config_file" "$name" "$expected_id"
            node "$GITHUB_WORKSPACE/scripts/preview-hyperdrive-retarget-contract.mjs" \
              target-state "$config_file" "$url_file"
          }
          hyperdrive_config_id() {
            local name="$1"
            local list_file
            local config_file
            local count
            list_file="$(mktemp "$temp_dir/hyperdrive-identity-list.XXXXXX")"
            config_file="$(mktemp "$temp_dir/hyperdrive-identity-config.XXXXXX")"
            fetch_hyperdrive_list "$list_file"
            count="$(hyperdrive_count "$list_file" "$name" '')"
            if [[ "$count" -ne 1 ]]; then
              printf 'The expected Hyperdrive identity is unavailable or ambiguous: %s\n' "$name" >&2
              return 2
            fi
            write_hyperdrive_config "$list_file" "$config_file" "$name" ''
            jq -er '.id | select(type == "string" and test("^[0-9a-f]{32}$"))' "$config_file"
          }
          ensure_hyperdrive() {
            local name="$1"
            local url_file="$2"
            local output_name="$3"
            local expected_existing="$4"
            local allow_mismatch="$5"
            local expected_id="$6"
            local runtime_url
            local list_file
            local current_file
            local verified_file
            local count
            local id=""
            local state
            runtime_url="$(<"$url_file")"
            printf '::add-mask::%s\n' "$runtime_url"
            list_file="$(mktemp "$temp_dir/hyperdrive-list.XXXXXX")"
            current_file="$(mktemp "$temp_dir/hyperdrive-current.XXXXXX")"
            verified_file="$(mktemp "$temp_dir/hyperdrive-verified.XXXXXX")"
            fetch_hyperdrive_list "$list_file"
            count="$(hyperdrive_count "$list_file" "$name" "$expected_id")"
            if [[ "$count" -gt 1 ]]; then
              printf 'Multiple Hyperdrive configs matched the expected identity: %s\n' "$name" >&2
              return 1
            fi
            if [[ "$count" -eq 0 ]]; then
              if [[ "$expected_existing" == "true" ]]; then
                printf 'Worker exists without its required Hyperdrive config: %s\n' "$name" >&2
                return 1
              fi
              local create_output_file created_id_file
              create_output_file="$(mktemp "$temp_dir/hyperdrive-create-output.XXXXXX")"
              created_id_file="$(mktemp "$temp_dir/hyperdrive-created-id.XXXXXX")"
              printf '%s\n' "$name" > "/tmp/werehere-hyperdrive-retarget/${output_name}-create-attempted"
              chmod 600 "/tmp/werehere-hyperdrive-retarget/${output_name}-create-attempted"
              if ! pnpm exec wrangler hyperdrive create "$name" \
                --config wrangler.preview.jsonc \
                --connection-string "$runtime_url" \
                --sslmode require \
                --caching-disabled >"$create_output_file" 2>&1; then
                rm -f "$create_output_file" "$created_id_file"
                printf 'Hyperdrive create outcome was ambiguous: %s\n' "$name" >&2
                return 1
              fi
              if ! id="$(
                node "$GITHUB_WORKSPACE/scripts/preview-hyperdrive-retarget-contract.mjs" \
                  parse-created-id "$create_output_file"
              )"; then
                rm -f "$create_output_file" "$created_id_file"
                printf 'Hyperdrive create ID was unavailable: %s\n' "$name" >&2
                return 1
              fi
              rm -f "$create_output_file"
              printf '%s\n' "$id" > "$created_id_file"
              install -m 600 "$created_id_file" "/tmp/werehere-hyperdrive-retarget/${output_name}-created-id"
              rm -f "$created_id_file"
            else
              write_hyperdrive_config "$list_file" "$current_file" "$name" "$expected_id"
              id="$(jq -er '.id | select(type == "string" and length > 0)' "$current_file")"
              state="$(node "$GITHUB_WORKSPACE/scripts/preview-hyperdrive-retarget-contract.mjs" \
                target-state "$current_file" "$url_file")"
              if [[ "$state" == "MISMATCH" ]]; then
                if [[ "$allow_mismatch" != "true" ]]; then
                  printf 'Hyperdrive target mismatch requires the approved retarget state: %s\n' "$name" >&2
                  return 1
                fi
                fetch_hyperdrive_list "$list_file"
                count="$(hyperdrive_count "$list_file" "$name" "$expected_id")"
                [[ "$count" -eq 1 ]] || return 1
                write_hyperdrive_config "$list_file" "$verified_file" "$name" "$expected_id"
                if ! cmp -s "$current_file" "$verified_file"; then
                  printf 'Hyperdrive changed after validation; refusing retarget: %s\n' "$name" >&2
                  return 1
                fi
                install -m 600 "$current_file" "/tmp/werehere-hyperdrive-retarget/${output_name}-before.json"
                pnpm exec wrangler hyperdrive update "$id" \
                  --config wrangler.preview.jsonc \
                  --connection-string "$runtime_url" \
                  --sslmode require \
                  --caching-disabled >/dev/null
                printf '%s_mutated=true\n' "$output_name" >> "$GITHUB_OUTPUT"
              elif [[ "$state" != "MATCH" ]]; then
                printf 'Hyperdrive origin metadata is invalid: %s\n' "$name" >&2
                return 1
              fi
            fi
            fetch_hyperdrive_list "$list_file"
            count="$(hyperdrive_count "$list_file" "$name" "$id")"
            if [[ "$count" -ne 1 ]]; then
              printf 'Hyperdrive config was unavailable or ambiguous after provisioning: %s\n' "$name" >&2
              return 1
            fi
            write_hyperdrive_config "$list_file" "$verified_file" "$name" "$id"
            if [[ -n "$id" && "$(jq -r '.id' "$verified_file")" != "$id" ]]; then
              printf 'Hyperdrive identity changed during provisioning: %s\n' "$name" >&2
              return 1
            fi
            id="$(jq -er '.id | select(type == "string" and length > 0)' "$verified_file")"
            state="$(node "$GITHUB_WORKSPACE/scripts/preview-hyperdrive-retarget-contract.mjs" \
              target-state "$verified_file" "$url_file")"
            if [[ "$state" != "MATCH" ]]; then
              printf 'Hyperdrive canonical origin read-back failed: %s\n' "$name" >&2
              return 1
            fi
            printf '%s=%s\n' "$output_name" "$id" >> "$GITHUB_OUTPUT"
          }
          mkdir -m 700 /tmp/werehere-hyperdrive-retarget
          api_existed="${{ steps.worker_snapshot.outputs.api_existed }}"
          reconciler_existed="${{ steps.worker_snapshot.outputs.reconciler_existed }}"
          reconciler_config_expected="$reconciler_existed"
          web_existed="${{ steps.worker_snapshot.outputs.web_existed }}"
          api_hyperdrive_id="${{ steps.worker_snapshot.outputs.api_hyperdrive_id }}"
          reconciler_hyperdrive_id="${{ steps.worker_snapshot.outputs.reconciler_hyperdrive_id }}"
          if [[ "$api_existed" == "true" && ! "$api_hyperdrive_id" =~ ^[0-9a-f]{32}$ ]]; then
            printf '%s\n' 'Existing API Worker Hyperdrive binding ID was invalid.' >&2
            exit 1
          fi
          if [[ "$reconciler_existed" == "true" && ! "$reconciler_hyperdrive_id" =~ ^[0-9a-f]{32}$ ]]; then
            printf '%s\n' 'Existing reconciler Worker Hyperdrive binding ID was invalid.' >&2
            exit 1
          fi
          if [[ "$PREVIEW_UNRESPONSIVE_REDEPLOY_REQUIRED" == "true" ]]; then
            if [[ "$api_existed" != "true" || "$reconciler_existed" != "true" || "$web_existed" != "true" ]]; then
              printf '%s\n' 'Preview unresponsive redeploy requires complete existing Worker topology.' >&2
              exit 1
            fi
            if [[ "$PREVIEW_HYPERDRIVE_RETARGET_REQUIRED" != "false" || \
                  "$PREVIEW_LEGACY_SCHEMA_RECOVERY_REQUIRED" != "false" ]]; then
              printf '%s\n' 'Preview unresponsive redeploy cannot alter Hyperdrive recovery state.' >&2
              exit 1
            fi
            reconciler_config_expected=true
            printf '%s\n' 'PREVIEW_UNRESPONSIVE_REDEPLOY_HYPERDRIVE_MUTATION_DENIED'
          fi
          if [[ "$PREVIEW_HYPERDRIVE_RETARGET_REQUIRED" == "true" && "$PREVIEW_LEGACY_SCHEMA_RECOVERY_REQUIRED" == "true" ]]; then
            printf '%s\n' 'Preview Hyperdrive retarget and legacy schema recovery cannot both be required.' >&2
            exit 1
          fi
          if [[ "$PREVIEW_HYPERDRIVE_RETARGET_REQUIRED" == "true" ]]; then
            if [[ "$PREVIEW_HYPERDRIVE_RETARGET_APPROVED" != "true" ]]; then
              printf '%s\n' 'Preview Hyperdrive retarget was not explicitly approved.' >&2
              exit 1
            fi
            if [[ "$api_existed" != "true" || "$web_existed" != "true" ]]; then
              printf '%s\n' 'Preview Hyperdrive retarget requires existing API and Web Workers.' >&2
              exit 1
            fi
            if [[ "$reconciler_existed" == "true" ]]; then
              retarget_topology=COMPLETE
            else
              retarget_topology=API_WEB_LEGACY
            fi
            api_target_state="$(hyperdrive_target_state \
              'werehere-hotel-api-preview' "$API_RUNTIME_DATABASE_URL_FILE" \
              "$api_hyperdrive_id")"
            set +e
            retarget_decision="$(
              node "$GITHUB_WORKSPACE/scripts/preview-hyperdrive-retarget-contract.mjs" \
                decide "$PREVIEW_HYPERDRIVE_RETARGET_APPROVED" \
                DB_DEPENDENCY_UNAVAILABLE "$api_target_state" "$retarget_topology"
            )"
            decision_status="$?"
            set -e
            if [[ "$decision_status" -ne 0 || "$retarget_decision" != "RETARGET" ]]; then
              printf '%s\n' 'Preview API Hyperdrive retarget decision was denied.' >&2
              exit 1
            fi
            printf '%s\n' 'PREVIEW_API_HYPERDRIVE_TARGET_MISMATCH_CONFIRMED'
          elif [[ "$PREVIEW_LEGACY_SCHEMA_RECOVERY_REQUIRED" == "true" ]]; then
            if [[ "$PREVIEW_HYPERDRIVE_RETARGET_APPROVED" != "true" && \
                  "$PREVIEW_LEGACY_SCHEMA_RECOVERY_ATTESTED" != "true" ]]; then
              printf '%s\n' 'Preview canonical legacy recovery was neither explicitly approved nor attested.' >&2
              exit 1
            fi
            if [[ "$api_existed" != "true" || "$web_existed" != "true" ]]; then
              printf '%s\n' 'Preview canonical schema recovery requires existing API and Web Workers.' >&2
              exit 1
            fi
            if [[ "$reconciler_existed" == "true" ]]; then
              recovery_topology=COMPLETE
              reconciler_config_expected=true
            else
              recovery_topology=API_WEB_LEGACY
            fi
            api_target_state="$(hyperdrive_target_state \
              'werehere-hotel-api-preview' "$API_RUNTIME_DATABASE_URL_FILE" \
              "$api_hyperdrive_id")"
            recovery_approved="$PREVIEW_HYPERDRIVE_RETARGET_APPROVED"
            if [[ "$PREVIEW_LEGACY_SCHEMA_RECOVERY_ATTESTED" == "true" ]]; then
              recovery_approved=true
            fi
            set +e
            recovery_decision="$(
              node "$GITHUB_WORKSPACE/scripts/preview-hyperdrive-retarget-contract.mjs" \
                decide "$recovery_approved" \
                SCHEMA_NOT_READY "$api_target_state" "$recovery_topology"
            )"
            decision_status="$?"
            set -e
            if [[ "$decision_status" -ne 0 || "$recovery_decision" != "CONTINUE_CANONICAL_LEGACY_RECOVERY" ]]; then
              printf '%s\n' 'Preview canonical legacy recovery decision was denied.' >&2
              exit 1
            fi
            if [[ "$recovery_topology" == "API_WEB_LEGACY" ]]; then
              set +e
              reconciler_hyperdrive_id="$(
                hyperdrive_config_id 'werehere-hotel-reconciler-preview'
              )"
              reconciler_identity_status="$?"
              set -e
              if [[ "$reconciler_identity_status" -ne 0 ]]; then
                printf '%s\n' 'Preview canonical legacy recovery requires one exact reconciler Hyperdrive identity.' >&2
                exit 1
              fi
            fi
            set +e
            reconciler_target_state="$(hyperdrive_target_state \
              'werehere-hotel-reconciler-preview' "$RECONCILER_DATABASE_URL_FILE" \
              "$reconciler_hyperdrive_id")"
            reconciler_target_status="$?"
            set -e
            if [[ "$reconciler_target_status" -ne 0 || "$reconciler_target_state" != "MATCH" ]]; then
              printf '%s\n' 'Preview canonical legacy recovery requires an existing canonical reconciler Hyperdrive.' >&2
              exit 1
            fi
            reconciler_config_expected=true
            printf '%s\n' 'PREVIEW_CANONICAL_LEGACY_RECOVERY_PROVIDER_MUTATION_DENIED'
            printf '%s\n' 'PREVIEW_CANONICAL_LEGACY_SCHEMA_RECOVERY_CONFIRMED'
          elif [[ "$PREVIEW_HYPERDRIVE_RETARGET_APPROVED" == "true" ]]; then
            printf '%s\n' 'Preview Hyperdrive retarget was approved without a failed existing-Worker readiness gate.' >&2
            exit 1
          fi
          snapshot_legacy_hyperdrive "$legacy_before"
          legacy_hyperdrive_id="$(jq -er '.id | select(type == "string" and length > 0)' "$legacy_before")"
          ensure_hyperdrive 'werehere-hotel-api-preview' \
            "$API_RUNTIME_DATABASE_URL_FILE" api_id "$api_existed" \
            "$PREVIEW_HYPERDRIVE_RETARGET_REQUIRED" "$api_hyperdrive_id"
          ensure_hyperdrive 'werehere-hotel-reconciler-preview' \
            "$RECONCILER_DATABASE_URL_FILE" reconciler_id "$reconciler_config_expected" \
            "$PREVIEW_HYPERDRIVE_RETARGET_REQUIRED" "$reconciler_hyperdrive_id"
          snapshot_legacy_hyperdrive "$legacy_after"
          if [[ "$api_hyperdrive_id" == "$legacy_hyperdrive_id" ]]; then
            if [[ "$(jq -er '.id' "$legacy_after")" != "$legacy_hyperdrive_id" ]]; then
              printf '%s\n' 'The active legacy-named API Hyperdrive identity changed.' >&2
              exit 1
            fi
            printf 'legacy_api_promoted=true\n' >> "$GITHUB_OUTPUT"
            printf '%s\n' 'PREVIEW_LEGACY_HYPERDRIVE_PROMOTED_TO_CANONICAL_API'
          else
            if ! cmp -s "$legacy_before" "$legacy_after"; then
              printf '%s\n' 'The legacy Preview Hyperdrive changed during account release provisioning.' >&2
              exit 1
            fi
            printf 'legacy_api_promoted=false\n' >> "$GITHUB_OUTPUT"
            printf '%s\n' 'PREVIEW_LEGACY_HYPERDRIVE_PRESERVED'
          fi
          printf '%s\n' 'PREVIEW_HYPERDRIVES_READY'

      - name: Verify previous Workers use canonical Preview Hyperdrives
        if: steps.worker_snapshot.outputs.api_existed == 'true' && steps.worker_snapshot.outputs.web_existed == 'true'
        id: expand_compatibility_smoke
        env:
          PREVIEW_BOOTSTRAP_MAPPING_PHASE: PRE_ROTATION
        run: |
          if [[ "${{ steps.pre_hyperdrive_compatibility.outputs.unresponsive_redeploy_required }}" == "true" ]]; then
            printf '%s\n' 'PREVIEW_UNRESPONSIVE_WORKER_PRE_DEPLOY_SMOKE_DEFERRED'
          elif [[ "${{ steps.hyperdrive.outputs.legacy_api_promoted }}" == "true" && \
                ( "${{ steps.pre_hyperdrive_compatibility.outputs.retarget_required }}" == "true" || \
                  "${{ steps.pre_hyperdrive_compatibility.outputs.legacy_schema_recovery_required }}" == "true" ) ]]; then
            printf '%s\n' 'PREVIEW_LEGACY_API_POST_RETARGET_SMOKE_DEFERRED'
          else
            node scripts/smoke-cloudflare-preview.mjs
            ZITADEL_PREVIEW_SUBJECT=${{ secrets.ZITADEL_PREVIEW_SUBJECT }} PREVIEW_BOOTSTRAP_LOGIN_ID=${{ secrets.PREVIEW_BOOTSTRAP_LOGIN_ID }} node scripts/smoke-zitadel-console-preview.mjs
          fi

      - name: Ensure isolated Preview private R2 bucket
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          inventory_page="$(mktemp)"
          inventory_all="$(mktemp)"
          inventory_next="$(mktemp)"
          create_file="$(mktemp)"
          trap 'rm -f "$inventory_page" "$inventory_all" "$inventory_next" "$create_file"' EXIT
          inventory() {
            printf '%s\n' '[]' > "$inventory_all"
            local cursor=""
            local encoded_cursor=""
            local page=0
            declare -A seen_cursors=()
            while :; do
              page=$((page + 1))
              if (( page > 100 )); then
                printf '%s\n' 'Preview R2 inventory exceeded the bounded page limit.' >&2
                exit 1
              fi
              encoded_cursor="$(jq -rn --arg value "$cursor" '$value | @uri')"
              curl --fail --silent --show-error \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets?per_page=1000${cursor:+&cursor=$encoded_cursor}" \
                > "$inventory_page"
              jq -e '
                .success == true
                and (.result | type) == "object"
                and (.result.buckets | type) == "array"
                and all(.result.buckets[]; (type == "object") and (.name | type) == "string" and (.name | length) > 0)
                and ((.result_info // {}) | type) == "object"
                and ((.result_info.cursor // null) == null or ((.result_info.cursor | type) == "string" and (.result_info.cursor | length) > 0))
              ' "$inventory_page" >/dev/null
              jq -s '.[0] + [.[1].result.buckets[] | {name}]' \
                "$inventory_all" "$inventory_page" > "$inventory_next"
              mv "$inventory_next" "$inventory_all"
              cursor="$(jq -r '.result_info.cursor // empty' "$inventory_page")"
              if [[ -z "$cursor" ]]; then break; fi
              if [[ -n "${seen_cursors[$cursor]:-}" ]]; then
                printf '%s\n' 'Preview R2 inventory repeated a cursor.' >&2
                exit 1
              fi
              seen_cursors[$cursor]=1
            done
          }
          inventory
          count="$(jq -er --arg name "$PREVIEW_R2_BUCKET_NAME" '[.[] | select(.name == $name)] | length' "$inventory_all")"
          if [[ "$count" == "0" ]]; then
            curl --fail --silent --show-error \
              -X POST \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data "$(jq -cn --arg name "$PREVIEW_R2_BUCKET_NAME" '{name:$name}')" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets" \
              > "$create_file"
            jq -e --arg name "$PREVIEW_R2_BUCKET_NAME" '
              .success == true and (.result | type) == "object" and .result.name == $name
            ' "$create_file" >/dev/null
            inventory
            count="$(jq -er --arg name "$PREVIEW_R2_BUCKET_NAME" '[.[] | select(.name == $name)] | length' "$inventory_all")"
          fi
          if [[ "$count" != "1" ]]; then
            printf '%s\n' 'Preview R2 bucket identity was missing or ambiguous.' >&2
            exit 1
          fi
          printf '%s\n' 'PREVIEW_R2_BUCKET_READY'

      - name: Render API Preview configuration
        env:
          API_HYPERDRIVE_ID: ${{ steps.hyperdrive.outputs.api_id }}
          RECONCILER_HYPERDRIVE_ID: ${{ steps.hyperdrive.outputs.reconciler_id }}
        run: |
          node scripts/render-api-preview-config.mjs \
            apps/api/wrangler.preview.jsonc \
            apps/api/wrangler.preview.generated.json
          node scripts/render-reconciler-preview-config.mjs \
            apps/api/wrangler.reconciler.preview.jsonc \
            apps/api/wrangler.reconciler.preview.generated.json

      - name: Deploy private account reconciler Worker
        id: deploy_reconciler
        working-directory: apps/api
        env:
          DEPLOY_TAG: github-${{ github.run_id }}-${{ github.run_attempt }}-reconciler
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'deploy_attempted=true\n' >> "$GITHUB_OUTPUT"
          reconciler_deploy_output="$(mktemp)"
          chmod 600 "$reconciler_deploy_output"
          trap 'rm -f "$reconciler_deploy_output"' EXIT
          if ! pnpm exec wrangler deploy \
            --config wrangler.reconciler.preview.generated.json \
            --strict \
            --tag "$DEPLOY_TAG" \
            > "$reconciler_deploy_output" 2>&1; then
            printf '%s\n' 'Preview Reconciler deploy failed.' >&2
            exit 1
          fi
          printf '%s\n' 'PREVIEW_RECONCILER_DEPLOYED'
          rm -f "$reconciler_deploy_output"
          deployments_file="$(mktemp)"
          trap 'rm -f "$deployments_file"' EXIT
          resolve_tagged_version() {
            local worker_name="$1"
            local tag="$2"
            local valid_absence_count=0
            local attempt
            for attempt in 1 2 3 4 5; do
              local versions_file
              versions_file="$(mktemp)"
              if curl --fail --silent --show-error \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$worker_name/versions?deployable=true" \
                > "$versions_file"; then
                local resolved
                if resolved="$(jq -er --arg tag "$tag" '
                  if .success != true
                    or (.result | type) != "object"
                    or (.result.items | type) != "array" then
                    error("Worker versions response failed safety validation")
                  else
                    [.result.items[] | select(.annotations["workers/tag"]? == $tag)] as $matches
                    | if ($matches | length) == 0 then ""
                      elif ($matches | length) != 1
                        or ($matches[0].id | type) != "string"
                        or ($matches[0].id | length) == 0 then
                        error("Tagged Worker version was ambiguous")
                      else $matches[0].id end
                  end
                ' "$versions_file")"; then
                  rm -f "$versions_file"
                  if [[ -n "$resolved" ]]; then
                    printf '%s\n' "$resolved"
                    return 0
                  fi
                  valid_absence_count=$((valid_absence_count + 1))
                else
                  rm -f "$versions_file"
                fi
              else
                rm -f "$versions_file"
              fi
              if [[ "$attempt" -lt 5 ]]; then sleep 2; fi
            done
            if [[ "$valid_absence_count" -eq 5 ]]; then return 1; fi
            return 2
          }
          deployed_version="$(resolve_tagged_version werehere-hotel-account-reconciler-preview "$DEPLOY_TAG")"
          printf 'deployed_version=%s\n' "$deployed_version" >> "$GITHUB_OUTPUT"
          pnpm --filter @werehere/api exec wrangler deployments list --name werehere-hotel-account-reconciler-preview --json > "$deployments_file"
          jq -e --arg version "$deployed_version" '
            type == "array" and length > 0
            and (.[-1].versions | type) == "array"
            and (.[-1].versions | length) == 1
            and .[-1].versions[0].percentage == 100
            and .[-1].versions[0].version_id == $version
          ' "$deployments_file" >/dev/null

      - name: Deploy private API Worker
        id: deploy_api
        working-directory: apps/api
        env:
          DEPLOY_TAG: secure-session-authority-v1-github-${{ github.run_id }}-${{ github.run_attempt }}-api
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AUTH_TRANSACTION_ENCRYPTION_KEY: ${{ secrets.AUTH_TRANSACTION_ENCRYPTION_KEY }}
          ZITADEL_SERVICE_USER_TOKEN: ${{ secrets.ZITADEL_SERVICE_USER_TOKEN }}
          ZITADEL_USER_PROVISIONER_TOKEN: ${{ secrets.ZITADEL_USER_PROVISIONER_TOKEN }}
          PREVIEW_FILE_SCANNER_AGENT_TOKEN: ${{ secrets.PREVIEW_FILE_SCANNER_AGENT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'deploy_attempted=true\n' >> "$GITHUB_OUTPUT"
          api_secrets_file="$(mktemp)"
          trap 'rm -f "$api_secrets_file"' EXIT
          export API_SECRETS_FILE="$api_secrets_file"
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ['API_SECRETS_FILE'])
          path.write_text(json.dumps({
              'AUTH_TRANSACTION_ENCRYPTION_KEY': os.environ['AUTH_TRANSACTION_ENCRYPTION_KEY'],
              'ZITADEL_SERVICE_USER_TOKEN': os.environ['ZITADEL_SERVICE_USER_TOKEN'],
              'ZITADEL_USER_PROVISIONER_TOKEN': os.environ['ZITADEL_USER_PROVISIONER_TOKEN'],
              'FILE_SCANNER_AGENT_TOKEN': os.environ['PREVIEW_FILE_SCANNER_AGENT_TOKEN'],
          }))
          path.chmod(0o600)
          PY
          unset AUTH_TRANSACTION_ENCRYPTION_KEY
          unset ZITADEL_SERVICE_USER_TOKEN
          unset ZITADEL_USER_PROVISIONER_TOKEN
          unset PREVIEW_FILE_SCANNER_AGENT_TOKEN
          (
            trap 'rm -f "$api_secrets_file"' EXIT
            pnpm exec wrangler deploy \
              --config wrangler.preview.generated.json \
              --secrets-file "$api_secrets_file" \
              --strict \
              --tag "$DEPLOY_TAG"
          )
          rm -f "$api_secrets_file"
          deployments_file="$(mktemp)"
          trap 'rm -f "$deployments_file"' EXIT
          resolve_tagged_version() {
            local worker_name="$1"
            local tag="$2"
            local valid_absence_count=0
            local attempt
            for attempt in 1 2 3 4 5; do
              local versions_file
              versions_file="$(mktemp)"
              if curl --fail --silent --show-error \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$worker_name/versions?deployable=true" \
                > "$versions_file"; then
                local resolved
                if resolved="$(jq -er --arg tag "$tag" '
                  if .success != true
                    or (.result | type) != "object"
                    or (.result.items | type) != "array" then
                    error("Worker versions response failed safety validation")
                  else
                    [.result.items[] | select(.annotations["workers/tag"]? == $tag)] as $matches
                    | if ($matches | length) == 0 then ""
                      elif ($matches | length) != 1
                        or ($matches[0].id | type) != "string"
                        or ($matches[0].id | length) == 0 then
                        error("Tagged Worker version was ambiguous")
                      else $matches[0].id end
                  end
                ' "$versions_file")"; then
                  rm -f "$versions_file"
                  if [[ -n "$resolved" ]]; then
                    printf '%s\n' "$resolved"
                    return 0
                  fi
                  valid_absence_count=$((valid_absence_count + 1))
                else
                  rm -f "$versions_file"
                fi
              else
                rm -f "$versions_file"
              fi
              if [[ "$attempt" -lt 5 ]]; then sleep 2; fi
            done
            if [[ "$valid_absence_count" -eq 5 ]]; then return 1; fi
            return 2
          }
          deployed_version="$(resolve_tagged_version werehere-hotel-api-preview "$DEPLOY_TAG")"
          printf 'deployed_version=%s\n' "$deployed_version" >> "$GITHUB_OUTPUT"
          pnpm --filter @werehere/api exec wrangler deployments list --name werehere-hotel-api-preview --json > "$deployments_file"
          jq -e --arg version "$deployed_version" '
            type == "array" and length > 0
            and (.[-1].versions | type) == "array"
            and (.[-1].versions | length) == 1
            and .[-1].versions[0].percentage == 100
            and .[-1].versions[0].version_id == $version
          ' "$deployments_file" >/dev/null

      - name: Verify deployed API private R2 binding
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
